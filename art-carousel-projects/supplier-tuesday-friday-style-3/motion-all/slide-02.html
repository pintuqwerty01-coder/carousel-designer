<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0}html,body{width:1080px;height:1350px;overflow:hidden;background:#1a1a1a}.state{position:absolute;inset:0;width:1080px;height:1350px}#ready,#final{opacity:0}#part{position:absolute;inset:0;transform-origin:627.6248216833095px 830.0285306704708px}#part img{position:absolute;left:0;top:0;width:1122px;height:1402px;transform-origin:0 0;transform:matrix(0.42829736776737853,0.02314986515443964,-0.02314986515443964,0.42829736776737853,246.36321804710676,423.47011982667277);clip-path:inset(662px 85px 338px 467px)}</style></head><body><img class="state" src="assets/02-prep.png"><img class="state" id="ready" src="assets/02-ready.png"><img class="state" id="final" src="assets/02-final.png"><div id="part"><img src="assets/02-part.png"></div><script>const keys=[[0, 0], [0.8, 0], [1.7, -10], [2, -10], [2.6, 0], [7, 0]];const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};window.setTime=t=>{ready.style.opacity=ease((t-0.7)/.4);document.getElementById('final').style.opacity=ease((t-2.8)/.5);let a=keys.at(-1)[1];for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){let [t0,a0]=keys[i-1],[t1,a1]=keys[i];a=a0+(a1-a0)*ease((t-t0)/(t1-t0));break}}part.style.transform=`rotate(${a}deg)`};setTime(0);let start;function play(ms){start??=ms;setTime(Math.min(7,(ms-start)/1000));if(ms-start<7000)requestAnimationFrame(play)}if(!location.search.includes('capture'))requestAnimationFrame(play);</script></body></html>
