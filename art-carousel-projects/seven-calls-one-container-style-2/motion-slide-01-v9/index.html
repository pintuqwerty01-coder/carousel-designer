<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:Poppins;src:url('assets/Poppins-Regular.ttf');font-weight:400}@font-face{font-family:Poppins;src:url('assets/Poppins-Bold.ttf');font-weight:700}*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden}body{font-family:Poppins;color:#101923;background:#f7f4ee}#stage{position:relative;width:1080px;height:1350px;overflow:hidden}#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#counter{position:absolute;left:62px;top:62px;font-size:24px;font-weight:700;color:#1e2831}#headline{position:absolute;left:62px;top:130px;width:950px;font-weight:700;font-size:82px;line-height:1.04;letter-spacing:-2.5px;z-index:8}#headline .cyan{color:#00abc1}#headline div{text-shadow:0 2px 2px #fffc}
#support{position:absolute;left:64px;top:468px;width:285px;font-size:26px;line-height:1.33;opacity:0;z-index:8;color:#17232c}#support span{display:block;white-space:nowrap}
#phones{position:absolute;inset:0;z-index:5;pointer-events:none}.handset{position:absolute;width:120px;height:120px;filter:drop-shadow(0 9px 6px #1821284b);opacity:0;transform-origin:center}.handset img{width:100%;height:100%;object-fit:contain}.badge{position:absolute;right:3px;bottom:3px;width:40px;height:40px;border-radius:50%;background:#00b2c7;color:white;border:3px solid #fff;font-size:20px;font-weight:700;display:grid;place-items:center;box-shadow:0 4px 10px #0003}
#phone1{left:515px;top:465px}#phone2{left:692px;top:475px}#phone3{left:890px;top:572px}#phone4{left:922px;top:772px}#phone5{left:790px;top:956px}#phone6{left:610px;top:1030px}#phone7{left:476px;top:800px}
#mascotBox{position:absolute;left:75px;top:915px;width:370px;height:412px;transform-origin:50% 100%;z-index:7;filter:drop-shadow(0 18px 12px #252a2f55)}#mascotBox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
</style></head><body><main id="stage"><img id="scene" src="assets/port-clean.png"><div id="counter">1/7</div><div id="headline"><div>7 CALLS.</div><div class="cyan">STILL CHASING</div><div class="cyan">ONE CONTAINER.</div></div><div id="phones"></div><div id="mascotBox"><img id="walk" src="assets/mascot-walk.png"><img id="walk2" src="assets/mascot-walk2.png"><img id="calm" src="assets/mascot-calm.png"><img id="stress" src="assets/mascot-stressed.png"></div><div id="support"><span>Every update</span><span>creates another</span><span>check, another</span><span>change, another</span><span>follow-up—for you.</span></div></main><script>
const phones=document.getElementById('phones');for(let i=1;i<=7;i++)phones.insertAdjacentHTML('beforeend',`<div class="handset" id="phone${i}"><img src="assets/handset.png"><div class="badge">${i}</div></div>`);
const el=id=>document.getElementById(id),set=(id,k,v)=>el(id).style[k]=v,ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
window.setTime=t=>{
 const walk=t<1.3,step=Math.floor(t/.24),arrival=ease(t/1.3),x=walk?Math.round((-245+245*arrival)/4)*4:0,foot=walk?-5*Math.sin(Math.PI*((t/.24)%1)):0;
 const anticipation=t>=5.47&&t<5.65?Math.sin(Math.PI*(t-5.47)/.18):0,shock=t>=5.65&&t<6.1?Math.sin(Math.PI*(t-5.65)/.45):0;
 set('mascotBox','transform',`translateX(${x}px) translateY(${foot+7*anticipation-22*shock}px) rotate(${5*shock-2*anticipation}deg) scale(${1-.035*anticipation+.025*shock},${1-.05*anticipation+.03*shock})`);
 set('walk','opacity',walk&&step%2===0?1:0);set('walk2','opacity',walk&&step%2===1?1:0);set('calm','opacity',!walk&&t<5.65?1:0);set('stress','opacity',t>=5.65?1:0);
 for(let i=1;i<=7;i++){const start=1.65+(i-1)*.62,p=ease((t-start)/.31);set('phone'+i,'opacity',p);set('phone'+i,'transform',`translateY(${(1-p)*-22}px) scale(${.78+.22*p}) rotate(${[-25,20,-20,24,18,-20,15][i-1]}deg)`)}
 set('support','opacity',ease((t-6.75)/.5));
};window.setTime(0);
</script></body></html>
