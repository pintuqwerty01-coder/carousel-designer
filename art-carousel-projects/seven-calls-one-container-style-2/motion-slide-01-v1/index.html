<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:Poppins;src:url('assets/Poppins-Regular.ttf');font-weight:400}
@font-face{font-family:Poppins;src:url('assets/Poppins-Bold.ttf');font-weight:700}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden}body{font-family:Poppins;background:#031823;color:#fff}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden;background:#041c29}
#port{position:absolute;inset:0;width:1080px;height:1350px;object-fit:cover;transform-origin:50% 55%}
#shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(1,16,27,.70) 0%,rgba(1,16,27,.35) 48%,rgba(1,16,27,.04) 78%),linear-gradient(0deg,rgba(0,14,22,.42),transparent 22%)}
#mascotBox{position:absolute;left:335px;top:890px;width:350px;height:475px;transform-origin:50% 100%;z-index:9;filter:drop-shadow(0 18px 14px rgba(0,0,0,.55))}
#mascotBox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#calm,#stress{opacity:0}
#lines{position:absolute;inset:0;width:1080px;height:1350px;overflow:visible;z-index:3;pointer-events:none}
#lines path{fill:none;stroke:#84eaf5;stroke-width:2.2;stroke-dasharray:6 9;opacity:.64;filter:drop-shadow(0 0 6px #04d8ed)}
#orbitLines{position:absolute;inset:0;width:1080px;height:1350px;z-index:4;pointer-events:none;opacity:0}
#orbitLines path{fill:none;stroke:#84eaf5;stroke-width:2;stroke-dasharray:5 8;opacity:.6;filter:drop-shadow(0 0 5px #04d8ed)}
.card{position:absolute;width:242px;height:112px;padding:12px 14px;border:2px solid #7feeff;border-radius:17px;background:linear-gradient(135deg,#f8fcff,#d5f8ff);box-shadow:0 0 24px rgba(11,218,241,.72),0 12px 25px rgba(0,0,0,.3);color:#061f2c;z-index:7;transform-origin:center;opacity:0}
.card .label{font-size:24px;line-height:1.15;font-weight:700;white-space:nowrap}.thumb{position:absolute;left:16px;bottom:14px;width:77px;height:39px;background:repeating-linear-gradient(90deg,#087b9d 0 7px,#0a91ae 7px 9px);border:2px solid #17445c;box-shadow:4px 4px 0 #b4dde6;transform:skewY(-4deg)}.phone{position:absolute;right:15px;bottom:14px;width:46px;height:46px;background:#00bbd4;border:3px solid #e9ffff;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 10px #00d8ec}.phone svg{width:25px;height:25px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#booking{left:75px;top:275px}#packing{left:75px;top:420px}#pickup{left:65px;top:590px}#delay{left:755px;top:335px}#truck{left:65px;top:785px}#loading{left:755px;top:680px}#customs{left:755px;top:825px}
.orbit{position:absolute;width:68px;height:68px;border:2.5px solid #7cf6ff;border-radius:50%;background:rgba(0,180,211,.42);box-shadow:0 0 15px #04d6ea,0 0 34px #04d6ea88;display:grid;place-items:center;z-index:6;opacity:0}.orbit svg{width:33px;height:33px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
#o1{left:820px;top:270px}#o2{left:890px;top:390px}#o3{left:950px;top:600px}#o4{left:875px;top:824px}#o5{left:645px;top:940px}#o6{left:555px;top:740px}#o7{left:760px;top:620px}
#copy{position:absolute;inset:0;z-index:10;pointer-events:none}#counter{position:absolute;left:64px;top:70px;font-size:25px;opacity:0}#headline{position:absolute;left:62px;top:150px;width:930px;font-size:83px;line-height:1.03;letter-spacing:-2.5px;font-weight:700}#headline>div{opacity:0;transform:translateY(24px)}.aqua{color:#30e6ee}#support{position:absolute;left:64px;top:492px;width:550px;font-size:31px;line-height:1.34;font-weight:400;opacity:0;text-shadow:0 2px 14px #001b28aa}#support span{display:block;white-space:nowrap}
#grain{position:absolute;inset:0;z-index:11;opacity:.1;pointer-events:none;background:radial-gradient(circle at 15% 4%,#64f1ff 0,transparent 2%),radial-gradient(circle at 92% 81%,#fff 0,transparent 1%)}
</style></head><body><main id="stage"><img id="port" src="assets/port-clean.png"><div id="shade"></div>
<svg id="lines" viewBox="0 0 1080 1350"><path id="p0" d="M220 332 Q470 210 790 665"/><path id="p1" d="M220 477 Q480 360 790 665"/><path id="p2" d="M210 647 Q460 500 790 665"/><path id="p3" d="M875 392 Q820 490 790 665"/><path id="p4" d="M210 840 Q490 770 790 665"/><path id="p5" d="M875 737 Q830 700 790 665"/><path id="p6" d="M875 882 Q835 740 790 665"/></svg>
<svg id="orbitLines" viewBox="0 0 1080 1350"><path d="M855 305 Q820 455 810 665"/><path d="M925 425 Q865 535 810 665"/><path d="M985 635 Q900 640 810 665"/><path d="M910 860 Q840 755 810 665"/><path d="M680 975 Q690 780 810 665"/><path d="M590 775 Q690 670 810 665"/><path d="M795 655 Q810 655 810 665"/></svg>
<div id="cards"></div><div id="orbits"></div>
<div id="mascotBox"><img id="calm" src="assets/mascot-calm.png"><img id="stress" src="assets/mascot-stressed.png"></div>
<div id="copy"><div id="counter">1/7</div><div id="headline"><div id="h1">7 CALLS.</div><div class="aqua" id="h2">STILL CHASING</div><div class="aqua" id="h3">ONE CONTAINER.</div></div><div id="support"><span>Every update creates</span><span>another check, another</span><span>change, another follow-up—</span><span>for you.</span></div></div><div id="grain"></div></main>
<script>
const names=['Booking','Packing List','Pickup','Delay Update','Truck Timing','Loading Window','Customs Check'];const ids=['booking','packing','pickup','delay','truck','loading','customs'];const starts=[2,2.8,4.1,4.8,5.6,6.3,7.25];
const phone='<svg viewBox="0 0 32 32"><path d="M8 5c1-1 3-1 4 1l2 4c.5 1 0 2-1 3l-2 2c2 4 5 7 9 9l2-2c1-1 2-1 3-1l4 2c2 1 2 3 1 4-2 3-5 4-8 3C13 27 5 19 2 10 1 7 4 4 8 5Z"/></svg>';
const cards=document.getElementById('cards'),orbits=document.getElementById('orbits');ids.forEach((id,i)=>{cards.insertAdjacentHTML('beforeend',`<div class="card" id="${id}"><span class="label">${names[i]}</span><div class="thumb"></div><div class="phone">${phone}</div></div>`);orbits.insertAdjacentHTML('beforeend',`<div class="orbit" id="o${i+1}">${phone}</div>`)});
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>1-Math.pow(1-clamp(x),3),S=(id,prop,v)=>document.getElementById(id).style[prop]=v;
window.setTime=function(t){
 const walk=ease(t/1.4),bob=t<1.5?Math.sin(t*17)*9*(1-walk):t<10?Math.sin(t*2.5)*2:0;
 S('port','transform',`scale(${1.025-.025*ease(t/2)}) translateY(${8-8*ease(t/2)}px)`);
 S('mascotBox','transform',`translateX(${-730+730*walk}px) translateY(${bob}px) rotate(${t>7&&t<10?-2*Math.sin((t-7)*7):0}deg)`);
 const stress=clamp((t-7.15)/.42);S('calm','opacity',1-stress);S('stress','opacity',stress);
 ids.forEach((id,i)=>{let a=ease((t-starts[i])/.48)*(1-ease((t-10.1)/.55));S(id,'opacity',a);S(id,'transform',`translateY(${(1-a)*23}px) scale(${.88+.12*a})`);S('p'+i,'opacity',a*.62)});
 const orbit=ease((t-10.35)/.75);S('orbitLines','opacity',orbit);for(let i=1;i<=7;i++){S('o'+i,'opacity',orbit);S('o'+i,'transform',`scale(${.75+.25*orbit})`)}
 S('counter','opacity',ease((t-10.45)/.7));['h1','h2','h3'].forEach((id,i)=>{const a=ease((t-(10.35+i*.48))/.62);S(id,'opacity',a);S(id,'transform',`translateY(${(1-a)*24}px)`)});S('support','opacity',ease((t-12.1)/.9));
};window.setTime(0);
</script></body></html>
