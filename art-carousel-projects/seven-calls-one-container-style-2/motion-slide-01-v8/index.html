<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:Poppins;src:url('assets/Poppins-Regular.ttf');font-weight:400}@font-face{font-family:Poppins;src:url('assets/Poppins-Bold.ttf');font-weight:700}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden}body{font-family:Poppins;color:#fff;background:#031421}#stage{position:relative;width:1080px;height:1350px;overflow:hidden}#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,14,29,.34),rgba(0,14,29,.03) 65%),linear-gradient(0deg,rgba(0,7,18,.24),transparent 20%)}
#counter{position:absolute;left:62px;top:68px;font-size:25px}#headline{position:absolute;left:62px;top:151px;width:930px;font-size:83px;line-height:1.03;letter-spacing:-2.5px;font-weight:700;text-shadow:0 3px 20px #001523aa;z-index:5}.aqua{color:#30e6ee}
#log{position:absolute;left:62px;top:478px;width:510px;height:450px;border:1px solid #5be3ed;border-radius:17px;background:linear-gradient(145deg,rgba(3,25,42,.93),rgba(5,49,69,.89));box-shadow:0 20px 40px #00101daa,0 0 20px #14d9ed36;z-index:4;overflow:hidden;opacity:0;transform-origin:left center}#logTop{height:67px;border-bottom:1px solid #63e9ef55;display:flex;align-items:center;justify-content:space-between;padding:0 23px;font-size:18px;letter-spacing:1px;font-weight:700;color:#dcfbff}#logTop b{color:#30e6ee;font-size:23px}#rows{padding:8px 20px}.row{height:51px;display:flex;align-items:center;border-bottom:1px solid #70dce83b;opacity:0;transform:translateY(6px)}.row:last-child{border:0}.num{font-size:15px;color:#6ce5ed;width:38px;font-weight:700}.row .label{font-size:20px;font-weight:700;flex:1}.call{height:30px;width:30px;border:1px solid #5eefff;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 10px #0fe0ed66}.call svg{width:17px;height:17px;fill:none;stroke:#58f0f7;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
#containerFocus{position:absolute;left:831px;top:690px;width:88px;height:88px;border:3px solid #60f1f8;border-radius:50%;box-shadow:0 0 0 7px #1ce6ee33,0 0 25px #3aefef;opacity:0;z-index:3}
#mascotBox{position:absolute;left:210px;top:937px;width:350px;height:390px;transform-origin:50% 100%;filter:drop-shadow(0 18px 13px #000a);z-index:6}#mascotBox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
#support{position:absolute;left:64px;top:500px;width:545px;font-size:31px;line-height:1.34;opacity:0;z-index:5;text-shadow:0 2px 14px #00121ecc}#support span{display:block;white-space:nowrap}
</style></head><body><main id="stage"><img id="scene" src="assets/port-clean.png"><div id="shade"></div><div id="counter">1/7</div><div id="headline"><div>7 CALLS.</div><div class="aqua">STILL CHASING</div><div class="aqua">ONE CONTAINER.</div></div>
<div id="log"><div id="logTop"><span>INBOUND CALLS · ONE CONTAINER</span><b id="count">01 / 07</b></div><div id="rows"></div></div><div id="containerFocus"></div>
<div id="mascotBox"><img id="walk" src="assets/mascot-walk.png"><img id="walk2" src="assets/mascot-walk2.png"><img id="calm" src="assets/mascot-calm.png"><img id="stress" src="assets/mascot-stressed.png"></div>
<div id="support"><span>Every update creates</span><span>another check, another</span><span>change, another follow-up—</span><span>for you.</span></div></main><script>
const labels=['Booking','Packing List','Pickup','Delay Update','Truck Timing','Loading Window','Customs Check'];const times=[1.8,2.34,2.88,3.42,3.96,4.5,5.04];const phone='<svg viewBox="0 0 24 24"><path d="M5 3c1-.7 2-.5 2.6.5l2 3.5c.5.8.3 1.6-.4 2.2L8 10.4c1.4 2.5 3.1 4.2 5.6 5.6l1.2-1.2c.6-.7 1.4-.9 2.2-.4l3.5 2c1 .6 1.2 1.6.5 2.6-1.2 1.8-3 2.2-4.6 1.7C10.7 18.8 5.2 13.3 3.3 7.6 2.8 6 3.2 4.2 5 3Z"/></svg>';const rows=document.getElementById('rows');labels.forEach((name,i)=>rows.insertAdjacentHTML('beforeend',`<div class="row" id="r${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="label">${name}</span><span class="call">${phone}</span></div>`));
const el=id=>document.getElementById(id),ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)},set=(id,key,val)=>el(id).style[key]=val;
window.setTime=t=>{
 const walk=t<1.35,step=Math.floor(t/.24),arrival=ease(t/1.35),x=walk?Math.round((-260+260*arrival)/4)*4:0;
 const foot=walk?-5*Math.sin(Math.PI*((t/.24)%1)):0,anticipate=t>=5.43&&t<5.62?Math.sin(Math.PI*(t-5.43)/.19):0,recoil=t>=5.62&&t<6.07?Math.sin(Math.PI*(t-5.62)/.45):0;
 set('mascotBox','transform',`translateX(${x}px) translateY(${foot+8*anticipate-19*recoil}px) rotate(${4*recoil-2*anticipate}deg) scale(${1-.035*anticipate+.025*recoil},${1-.05*anticipate+.03*recoil})`);
 set('walk','opacity',walk&&step%2===0?1:0);set('walk2','opacity',walk&&step%2===1?1:0);set('calm','opacity',!walk&&t<5.62?1:0);set('stress','opacity',t>=5.62?1:0);
 const log=ease((t-1.5)/.35)*(1-ease((t-6.25)/.5));set('log','opacity',log);set('log','transform',`scale(${.98+.02*ease((t-1.5)/.35)})`);
 let count=0;times.forEach((s,i)=>{let a=ease((t-s)/.3)*(1-ease((t-6.25)/.5));set('r'+i,'opacity',a);set('r'+i,'transform',`translateY(${(1-a)*6}px)`);if(t>=s+.25)count++});el('count').textContent=String(count).padStart(2,'0')+' / 07';
 const pulse=times.reduce((m,s)=>Math.max(m,t>=s&&t<s+.42?Math.sin(Math.PI*(t-s)/.42):0),0);set('containerFocus','opacity',pulse*.8);set('containerFocus','transform',`scale(${.75+.45*pulse})`);
 set('support','opacity',ease((t-6.85)/.5));
};window.setTime(0);
</script></body></html>
