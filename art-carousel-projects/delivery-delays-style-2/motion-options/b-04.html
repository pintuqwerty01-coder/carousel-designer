,end=p.getPointAtLength(p.getTotalLength());o.setAttribute('cx',point.x);o.setAttribute('cy',point.y);o.setAttribute('opacity',t<.5?0:1);r.setAttribute('cx',end.x);r.setAttribute('cy',end.y);r.setAttribute('r',24+Math.max(0,t-2.3)*20);r.setAttribute('opacity',t<2.3?0:Math.max(0,1-(t-2.3)/1.5));document.querySelectorAll('.tick').forEach((x,i)=>x.style.strokeDashoffset=30*(1-Math.max(0,Math.min(1,(t-.7-i*.3)/.45))));document.querySelectorAll('.bokeh').forEach((x,i)=>x.style.opacity=.12+.10*(1+Math.sin(t*2+i)));let flare=document.querySelector('.flare');if(flare)flare.style.opacity=.65+.2*Math.sin(t*2);let sweep=document.querySelector('.sweep');sweep.style.transform=`translateX(${-1600+t*880}px) rotate(-23deg)`;document.querySelector('.halo').style.opacity=.3+.3*(1+Math.sin(t*Math.PI));let dash=document.querySelector('.dash');if(dash)dash.style.strokeDashoffset=-t*20;}window.__timelines={proof:{seek:render}};render(0);</script></body></html>
