<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Poppins;src:url(assets/fonts/Poppins-Regular.ttf);font-weight:400}@font-face{font-family:Poppins;src:url(assets/fonts/Poppins-SemiBold.ttf);font-weight:600}@font-face{font-family:Poppins;src:url(assets/fonts/Poppins-Bold.ttf);font-weight:700}@font-face{font-family:Preahvihear;src:url(assets/fonts/Preahvihear-Regular.ttf)}*{box-sizing:border-box;margin:0}body{width:1080px;height:1350px;overflow:hidden;font-family:Poppins}.sl{position:relative;width:1080px;height:1350px;overflow:hidden}.dark{background:radial-gradient(ellipse at 75% 60%,#0F4E57 0,#08303A 43%,#03161B 100%);color:#fff}.aqua{background:linear-gradient(135deg,#36C2D4,#04ADC3 65%,#038DA0);color:#1A1A1A}.tx{position:absolute;left:84px;width:912px}.hd{font-family:Preahvihear;line-height:1.16}.big{font-family:Poppins;font-weight:700;letter-spacing:-3px;line-height:1.03}.bd{font-family:Poppins;line-height:1.5}.cnt{position:absolute;left:84px;top:58px;font-size:20px;letter-spacing:2px;border:1px solid #04ADC3;border-radius:50px;padding:7px 17px;color:#04ADC3}.aqua .cnt{color:#1A1A1A;border-color:#1A1A1A}.foot{position:absolute;bottom:58px;left:84px;font-weight:600;font-size:25px}.arrow{position:absolute;right:84px;bottom:52px;font-size:32px}.accent{color:#04ADC3}.aqua .accent{color:#fff}.pill{display:inline-block;border-radius:50px;padding:12px 21px;background:#1A1A1A;color:#fff;font-weight:600;font-size:27px}.visual{position:absolute;display:block}.line{position:absolute;left:84px;right:84px;bottom:111px;height:1px;background:rgba(255,255,255,.24)}.aqua .line{background:rgba(26,26,26,.25)}.diagram text{font-family:Poppins;font-size:22px;font-weight:600;letter-spacing:1px}.signal{filter:drop-shadow(0 0 10px #04ADC3)}</style></head><body><main data-composition-id="proof"><div class="sl dark"><div class="cnt">01/09</div><div class="tx big" style="top:164px;font-size:90px"><span class="accent">CATCH DELIVERY<br>DELAYS</span><br><span style="font-size:48px;letter-spacing:-1px">BEFORE YOUR CUSTOMER DOES.</span></div><div class="tx hd" style="top:448px;font-size:38px;width:850px">Your team already handles the unexpected.<br>What if you heard first?</div><img class="visual" src="assets/img/cover-alert.png" style="left:16px;top:602px;width:650px"><svg class="visual diagram" style="left:642px;top:650px;width:354px;height:390px" viewBox="0 0 354 390"><path d="M0 182H42Q65 182 65 150V77Q65 50 100 50H195" fill="none" stroke="#04ADC3" stroke-width="4"/><path d="M42 182H65V290Q65 322 100 322H195" fill="none" stroke="#5D7B80" stroke-width="3" stroke-dasharray="8 9"/><rect x="124" y="10" width="220" height="91" rx="22" fill="#04ADC3"/><text x="235" y="44" fill="#03161B" text-anchor="middle">YOUR TEAM</text><path d="m222 66 9 9 16-19" stroke="#03161B" fill="none" stroke-width="4" stroke-linecap="round"/><rect x="124" y="278" width="220" height="91" rx="22" fill="none" stroke="#5D7B80"/><text x="235" y="331" fill="#A6BEC2" text-anchor="middle">CUSTOMER</text><circle id="signal" class="signal" r="8" fill="#FFFFFF" cx="0" cy="182"/></svg><div class="tx bd" style="top:1096px;font-size:30px">Delays start small. <span class="accent" style="font-weight:600">Swipe to see where.</span></div><div class="line"></div><div class="foot">@arealtimetech</div><div class="arrow">→</div></div></main><script>let current=0;function render(t){current=t;let s=document.getElementById('signal');let u=Math.min(1,Math.max(0,(t-.4)/1.5));let x,y;if(u<.23){x=u/.23*65;y=182}else if(u<.65){x=65;y=182-(u-.23)/.42*132}else{x=65+(u-.65)/.35*130;y=50}s.setAttribute('cx',x);s.setAttribute('cy',y);s.setAttribute('opacity',t<.4?0:1);}window.__timelines={proof:{seek:(t)=>render(t)}};render(0);</script></body></html>
