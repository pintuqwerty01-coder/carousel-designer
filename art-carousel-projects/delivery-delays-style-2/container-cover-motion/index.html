<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Preahvihear;src:url(assets/fonts/Preahvihear-Regular.ttf)}*{box-sizing:border-box}body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#03161b;color:white;font-family:Preahvihear}#scene{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 12%,#087c8b 0,transparent 34%),radial-gradient(ellipse at 80% 50%,#0d4e59,transparent 68%),linear-gradient(130deg,#02161c,#062e37 68%,#041a22)}.floor{position:absolute;top:1110px;width:100%;height:260px;background:radial-gradient(ellipse at 85% 30%,#38616b88,transparent 58%)}.streak{position:absolute;left:-100px;top:170px;width:1350px;height:2px;background:linear-gradient(90deg,transparent,#7ff7ffbb,transparent);transform:rotate(-7deg);box-shadow:0 0 9px #7affff}.streak.two{top:420px;transform:rotate(-28deg);opacity:.35}.flare{position:absolute;left:755px;top:100px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,white 0,#c3ffff 8%,#7bfaff66 32%,transparent 70%);mix-blend-mode:screen}.hero{position:absolute;left:732px;top:125px;width:680px;height:1020px;object-fit:fill}.lower{clip-path:polygon(0 38%,48% 34%,100% 53%,100% 100%,0 100%)}.upper{clip-path:polygon(0 0,100% 0,100% 53%,48% 34%,0 38%)}.hook{-webkit-text-stroke:1.1px currentColor;position:absolute;left:60px;top:180px;font-size:94px;line-height:1.04;letter-spacing:-3px;z-index:4}.hook .cyan{color:#00c7da}.hook .small{font-size:79px;letter-spacing:-2px}.body{position:absolute;left:64px;top:698px;font-size:45px;line-height:1.32;z-index:4}.nudge{position:absolute;left:66px;top:936px;font-size:32px;line-height:1.35;z-index:4}.nudge strong{color:#00c7da}.foot{position:absolute;left:62px;bottom:68px;font-size:28px}.arrow{position:absolute;right:68px;bottom:74px;width:50px;height:52px;border:2px solid #c2fbff;border-radius:12px;display:grid;place-items:center;font-size:32px}.bokeh{position:absolute;border-radius:50%;filter:blur(5px);background:#00c8d9;opacity:.17}.ring{position:absolute;left:650px;top:245px;width:72px;height:72px;border-radius:50%;border:1px solid #9af9ff33;background:#8cefff13}
</style></head><body><div id="scene"><div class="floor"></div><div class="streak"></div><div class="streak two"></div><div class="flare" id="flare"></div><div class="ring"></div><img class="hero lower" src="assets/stack.png"><img id="top" class="hero upper" src="assets/stack.png"><div class="hook">CATCH<br><span class="cyan">DELIVERY<br>DELAYS</span><br><span class="small">BEFORE YOUR<br>CUSTOMER DOES.</span></div><div class="body">Your team already<br>handles the unexpected.<br>What if you heard first?</div><div class="nudge">Delays start small.<br><strong>Swipe to see where.</strong></div><div class="foot">@arealtimetech</div><div class="arrow" id="arrow"><svg width="30" height="24" viewBox="0 0 30 24"><path d="M3 12h22M18 5l7 7-7 7" fill="none" stroke="white" stroke-width="2"/></svg></div></div><script>
for(let i=0;i<14;i++){let b=document.createElement('div');b.className='bokeh';let x=(i*271+16)%1060,y=(i*379+146)%1340,r=12+i%3*8;b.style.cssText=`left:${x}px;top:${y}px;width:${r}px;height:${r}px`;document.getElementById('scene').appendChild(b)}
window.R=t=>{let u=Math.max(0,Math.min(1,(t-.35)/1.4)),y=-35*(1-u*u);document.getElementById('top').style.transform=`translateY(${y}px)`;document.getElementById('flare').style.opacity=.8+.14*Math.sin(t*Math.PI/2);document.getElementById('arrow').style.boxShadow=`0 0 ${10+5*Math.sin(t*Math.PI)}px #04adc366`};R(0);
</script></body></html>
